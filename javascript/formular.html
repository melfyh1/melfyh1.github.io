<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    
    <form id="ff">
        <label for="ålder">Ange din ålder </label>
        <input type="text" name="ålder" id="ålder" value="ålder">
        <label for="namn">Ange ditt namn </label>
        <input type="text" name="namn" id="namn" value="namn">
        <label for="epostadress">Ange din epost-adress </label>
        <input type="text" name="Epostadress" id="epostadress" value="epost-adress">
        <button type="submit">Skicka</button>

    </form>

    <div id="textruta"> 

    </div>
    <script>
        let form=document.getElementById("ff");

        form.addEventListener("submit", function(e){
            
            e.preventDefault();
            let namn=document.getElementById("epostadress").value;


            document.getElementById("textruta").innerHTML=namn;
        });
    </script>


</body>
</html
